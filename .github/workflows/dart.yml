import SwiftUI
import UIKit

struct LinkItem: Identifiable, Codable, Equatable {
    var id = UUID()
    var name: String
    var url: String
}

@main
struct BypassAIApp: App {
    var body: some Scene {
        WindowGroup { LinkMenuView() }
    }
}

struct LinkMenuView: View {
    @AppStorage("savedLinks") private var savedLinksData = ""
    @State private var links: [LinkItem] = []
    @State private var searchText = ""
    @State private var newName = ""
    @State private var newURL = ""
    @State private var showingAdd = false
    @State private var revealedID: UUID?
    @State private var copiedID: UUID?
    @State private var favorites: Set<UUID> = []

    private let defaults = [
        LinkItem(name: "FILE BYPASS AI DEEPSEEK", url: "https://tasksub.io/en/WNpb"),
        LinkItem(name: "FILE BYPASS AI CLAUDE", url: "https://tasksub.io/en/PMlRN"),
        LinkItem(name: "FILE BYPASS CHATGPT", url: "https://oklink2.online/BYPASSALLAI")
    ]

    private var filteredLinks: [LinkItem] {
        searchText.isEmpty ? links : links.filter { $0.name.localizedCaseInsensitiveContains(searchText) }
    }

    var body: some View {
        ZStack {
            LinearGradient(colors: [Color(red: 0.035, green: 0.025, blue: 0.075),
                                    Color(red: 0.075, green: 0.025, blue: 0.085),
                                    Color(red: 0.015, green: 0.025, blue: 0.065)],
                           startPoint: .topLeading, endPoint: .bottomTrailing)
                .ignoresSafeArea()

            ScrollView {
                VStack(alignment: .leading, spacing: 18) {
                    HStack {
                        VStack(alignment: .leading, spacing: 4) {
                            Text("bypass ai")
                                .font(.system(size: 29, weight: .black, design: .rounded))
                                .foregroundStyle(.white)
                            Text("LINK COLLECTION")
                                .font(.system(size: 11, weight: .bold, design: .monospaced))
                                .tracking(3)
                                .foregroundStyle(.cyan.opacity(0.8))
                        }
                        Spacer()
                        Button { showingAdd = true; newName = ""; newURL = "" } label: {
                            Image(systemName: "plus")
                                .font(.system(size: 18, weight: .bold))
                                .foregroundStyle(.white)
                                .frame(width: 48, height: 48)
                                .background(Color.cyan.opacity(0.2))
                                .overlay(RoundedRectangle(cornerRadius: 15).stroke(Color.cyan.opacity(0.8), lineWidth: 1.5))
                                .shadow(color: .cyan.opacity(0.35), radius: 12)
                        }
                    }
                    .padding(.top, 12)

                    HStack(spacing: 12) {
                        Image(systemName: "asterisk")
                            .foregroundStyle(.white)
                            .frame(width: 46, height: 46)
                            .background(Color.white.opacity(0.1))
                            .clipShape(RoundedRectangle(cornerRadius: 13))
                            .overlay(RoundedRectangle(cornerRadius: 13).stroke(Color.white.opacity(0.3)))
                        Text("BYPASS & ANTIBAN")
                            .font(.system(size: 23, weight: .black, design: .rounded))
                            .foregroundStyle(.white)
                        Spacer(minLength: 0)
                    }
                    .padding(14)
                    .background(LinearGradient(colors: [Color.white.opacity(0.12), Color.purple.opacity(0.10)], startPoint: .leading, endPoint: .trailing))
                    .clipShape(RoundedRectangle(cornerRadius: 20))
                    .overlay(RoundedRectangle(cornerRadius: 20).stroke(Color.white.opacity(0.22), lineWidth: 1))

                    HStack {
                        Image(systemName: "magnifyingglass").foregroundStyle(.cyan)
                        TextField("Tìm liên kết...", text: $searchText)
                            .foregroundStyle(.white)
                            .tint(.cyan)
                    }
                    .padding(13)
                    .background(Color.white.opacity(0.07))
                    .clipShape(RoundedRectangle(cornerRadius: 14))
                    .overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.cyan.opacity(0.28)))

                    ForEach(filteredLinks) { item in
                        LinkCard(
                            item: item,
                            isRevealed: revealedID == item.id,
                            isCopied: copiedID == item.id,
                            isFavorite: favorites.contains(item.id),
                            copyAction: {
                                UIPasteboard.general.string = item.url
                                revealedID = item.id
                                copiedID = item.id
                            },
                            favoriteAction: {
                                if favorites.contains(item.id) { favorites.remove(item.id) }
                                else { favorites.insert(item.id) }
                            },
                            deleteAction: { delete(item) }
                        )
                    }

                    Text("Nhấn SAO CHÉP để chép liên kết. URL chỉ hiện sau khi sao chép.")
                        .font(.system(size: 11, weight: .medium))
                        .foregroundStyle(.white.opacity(0.5))
                        .padding(.top, 2)
                        .padding(.bottom, 24)
                }
                .padding(.horizontal, 18)
            }
        }
        .preferredColorScheme(.dark)
        .sheet(isPresented: $showingAdd) {
            NavigationStack {
                Form {
                    TextField("Tên liên kết", text: $newName)
                    TextField("URL", text: $newURL)
                        .keyboardType(.URL)
                        .textInputAutocapitalization(.never)
                        .autocorrectionDisabled()
                }
                .navigationTitle("Thêm liên kết")
                .toolbar {
                    ToolbarItem(placement: .cancellationAction) {
                        Button("Hủy") { showingAdd = false }
                    }
                    ToolbarItem(placement: .confirmationAction) {
                        Button("Lưu") { saveNewLink() }
                            .disabled(newName.trimmingCharacters(in: .whitespaces).isEmpty ||
                                      newURL.trimmingCharacters(in: .whitespaces).isEmpty)
                    }
                }
            }
            .preferredColorScheme(.dark)
        }
        .onAppear(perform: loadLinks)
    }

    private func loadLinks() {
        if let data = savedLinksData.data(using: .utf8),
           let decoded = try? JSONDecoder().decode([LinkItem].self, from: data) {
            links = decoded
        }
        for item in defaults where !links.contains(where: {
            $0.name.localizedCaseInsensitiveCompare(item.name) == .orderedSame
        }) { links.append(item) }
        persist()
    }

    private func saveNewLink() {
        links.append(LinkItem(name: newName.trimmingCharacters(in: .whitespaces),
                              url: newURL.trimmingCharacters(in: .whitespaces)))
        persist()
        showingAdd = false
    }

    private func delete(_ item: LinkItem) {
        links.removeAll { $0.id == item.id }
        persist()
    }

    private func persist() {
        guard let data = try? JSONEncoder().encode(links),
              let string = String(data: data, encoding: .utf8) else { return }
        savedLinksData = string
    }
}

struct LinkCard: View {
    let item: LinkItem
    let isRevealed: Bool
    let isCopied: Bool
    let isFavorite: Bool
    let copyAction: () -> Void
    let favoriteAction: () -> Void
    let deleteAction: () -> Void

    var body: some View {
        VStack(alignment: .leading, spacing: 12) {
            HStack(alignment: .top, spacing: 13) {
                ZStack {
                    RoundedRectangle(cornerRadius: 17)
                        .fill(LinearGradient(colors: [Color.indigo.opacity(0.9), Color.blue.opacity(0.55)], startPoint: .topLeading, endPoint: .bottomTrailing))
                    Image(systemName: iconName)
                        .font(.system(size: 29, weight: .bold))
                        .foregroundStyle(.white)
                }
                .frame(width: 66, height: 66)
                .overlay(RoundedRectangle(cornerRadius: 17).stroke(Color.white.opacity(0.25), lineWidth: 1))

                VStack(alignment: .leading, spacing: 8) {
                    Text(item.name)
                        .font(.system(size: 16, weight: .heavy, design: .rounded))
                        .foregroundStyle(.white)
                        .fixedSize(horizontal: false, vertical: true)

                    Text("• DÁN VÀO CHAT")
                        .font(.system(size: 11, weight: .semibold, design: .monospaced))
                        .foregroundStyle(.white.opacity(0.7))

                    HStack(spacing: 7) {
                        Label("iOS", systemImage: "apple.logo")
                            .font(.system(size: 10, weight: .bold, design: .monospaced))
                            .foregroundStyle(.cyan)
                            .padding(.horizontal, 10)
                            .padding(.vertical, 6)
                            .background(Color.cyan.opacity(0.10))
                            .clipShape(Capsule())
                            .overlay(Capsule().stroke(Color.cyan.opacity(0.8), lineWidth: 1))
                    }
                }
                Spacer(minLength: 0)
                Button(action: favoriteAction) {
                    Image(systemName: isFavorite ? "heart.fill" : "heart")
                        .font(.system(size: 17, weight: .semibold))
                        .foregroundStyle(isFavorite ? .pink : .white.opacity(0.75))
                        .frame(width: 36, height: 36)
                        .background(Color.white.opacity(0.08))
                        .clipShape(Circle())
                }
            }

            HStack {
                Button(action: copyAction) {
                    Label(isCopied ? "ĐÃ SAO CHÉP" : "SAO CHÉP LINK",
                          systemImage: isCopied ? "checkmark" : "doc.on.doc")
                        .font(.system(size: 12, weight: .black, design: .rounded))
                        .tracking(0.7)
                        .foregroundStyle(.white)
                        .padding(.horizontal, 15)
                        .padding(.vertical, 11)
                        .background(LinearGradient(colors: [Color.blue.opacity(0.95), Color.cyan.opacity(0.65)], startPoint: .leading, endPoint: .trailing))
                        .clipShape(RoundedRectangle(cornerRadius: 12))
                        .shadow(color: .cyan.opacity(0.35), radius: 10)
                }
                if isCopied {
                    Text("Đã sao chép")
                        .font(.system(size: 11, weight: .bold))
                        .foregroundStyle(.green)
                }
                Spacer()
                Menu {
                    Button(role: .destructive, action: deleteAction) {
                        Label("Xóa liên kết", systemImage: "trash")
                    }
                } label: {
                    Image(systemName: "ellipsis")
                        .foregroundStyle(.white.opacity(0.7))
                        .padding(10)
                }
            }

            if isRevealed {
                Text(item.url)
                    .font(.system(size: 11, design: .monospaced))
                    .foregroundStyle(.white.opacity(0.72))
                    .textSelection(.enabled)
                    .padding(10)
                    .frame(maxWidth: .infinity, alignment: .leading)
                    .background(Color.black.opacity(0.24))
                    .clipShape(RoundedRectangle(cornerRadius: 9))
            }
        }
        .padding(15)
        .background(
            LinearGradient(colors: [Color(red: 0.10, green: 0.07, blue: 0.22),
                                    Color(red: 0.045, green: 0.06, blue: 0.16),
                                    Color(red: 0.04, green: 0.12, blue: 0.22)],
                           startPoint: .topLeading, endPoint: .bottomTrailing)
        )
        .clipShape(RoundedRectangle(cornerRadius: 23))
        .overlay(RoundedRectangle(cornerRadius: 23).stroke(Color.purple.opacity(0.75), lineWidth: 1.4))
        .shadow(color: .blue.opacity(0.20), radius: 14, y: 5)
        .contextMenu {
            Button(role: .destructive, action: deleteAction) {
                Label("Xóa liên kết", systemImage: "trash")
            }
        }
    }

    private var iconName: String {
        let name = item.name.lowercased()
        if name.contains("deepseek") { return "sparkle" }
        if name.contains("claude") { return "asterisk" }
        if name.contains("chatgpt") { return "brain" }
        return "link"
    }
}
